<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidking Mini Cineby</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Vidking Mini Cineby</h1>
  <input type="text" id="searchBar" placeholder="Search Movies/TV Shows...">
</header>

<h2 class="section-title">Movies</h2>
<div id="movieGrid" class="grid"></div>

<h2 class="section-title">TV Shows</h2>
<div id="tvGrid" class="grid"></div>

<h2 class="section-title">Continue Watching</h2>
<div id="continueWatching" class="carousel"></div>

<h2 class="section-title">Favorites</h2>
<div id="favorites" class="carousel"></div>

<div id="playerContainer">
  <iframe id="player" src="" allowfullscreen></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
